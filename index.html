<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>プチオープンキャンパス2026
    </title>
    <link rel="stylesheet" href="./style.css">
    <style>
        body{
            background-color: #fde492;/*背景色を変えてみよう*/
            
            /*演習２－２  この下から背景のデザインを記述*/
            

            
            
        }

    </style>
</head>

<body>
    <div class="container" id="form-view">
        <form id="store">
            <h2 style="text-align: center;">新規店舗登録</h2>
            <div class="second-container">
                <span>店舗名<span class="required">必須</span>：</span>
                <div id="nameError" class="error-message"></div>
                <input type="text" id="store-name" name="store-name" autocomplete="organization">
            </div>

            <div class="second-container">
                <p>郵便番号</p>
                <div style="display: flex; flex-direction: row;">
                    <input type="text" id="searchBox" placeholder="数字のみで入力してください。" onkeyup="inputCheck ()">
                    <button type="button" id="search-btn" onclick="searchAddress ()">検索</button>
                </div>
                <div id="check"></div>
                <div id="addressError" class="error-message"></div>
                <p>都道府県<span class="required">必須</span><input type="text" id="address-prefecture" name="address-prefecture"></p>
                <p>市区町村<span class="required">必須</span><input type="text" id="address-city" name="address-city"></p>
                <p>番地<span class="required">必須</span><input type="text" id="address-street" name="address-street"></p>
            </div>

            <div class="second-container">
                <span>ジャンル<span class="required">必須</span>：</span>
                <span style="color: rgb(195, 119, 119); font-size:small;margin-bottom: 10px;">一つ以上選択してください</span>
                <div id="checkboxError" class="error-message"></div>

                <div id="jenre-item" class="genre-list">
                    <label class="checkbox-option"><input type="checkbox" name="jenre-item" value="和食"> 和食</label>
                    <label class="checkbox-option"><input type="checkbox" name="jenre-item" value="洋食"> 洋食</label>
                    <label class="checkbox-option"><input type="checkbox" name="jenre-item" value="中華"> 中華</label>
                    <label class="checkbox-option"><input type="checkbox" name="jenre-item" value="カフェ"> カフェ</label>
                    <label class="checkbox-option"><input type="checkbox" name="jenre-item" value="イタリアン"> イタリアン</label>
                    <!--演習2-1 ジャンルを追加-->

                    



                </div>
            </div>

            <div class="second-container">
                <span>価格帯：</span>
                <div>
                    <p>
                        <span id="price-min-label"></span>
                        <span>〜</span>
                        <span id="price-max-label"></span>
                    </p>
                    <div class="range-slider__wrapper">
                        <div class="range-slider__track">
                            <div class="range-slider__fill" id="price-range-fill"></div>
                        </div>
                        <input type="range" id="price-min" class="range-slider__input range-slider__input--min" min="0"
                            max="6" step="1" value="0" aria-label="価格の下限">
                        <input type="range" id="price-max" class="range-slider__input range-slider__input--max" min="0"
                            max="6" step="1" value="6" aria-label="価格の上限">
                    </div>
                </div>
            </div>
        
            <div class="second-container">
                <div class="photo-container">

                    <div>
                    <input id="image_washoku" type="radio" value="washoku.png" name="image" checked>
                    <label for="image_washoku"><img src="./img/washoku.png" class="photo"></label>
                    </div>

                    <div>
                    <input id="image_youshoku" type="radio" value="youshoku.png" name="image">
                    <label for="image_youshoku"><img src="./img/youshoku.png" class="photo"></label>
                    </div>

                    <div>
                    <input id="image_chuka" type="radio" value="chuka.png" name="image">
                    <label for="image_chuka"><img src="./img/chuka.png" class="photo"></label>
                    </div>

                    <div>
                    <input id="image_cafe" type="radio" value="cafe.png" name="image">
                    <label for="image_cafe"><img src="./img/cafe.png" class="photo"></label>
                    </div>

                    <div>
                    <input id="image_italian" type="radio" value="italian.png" name="image">
                    <label for="image_italian"><img src="./img/italian.png" class="photo"></label>
                    </div>

                    
                </div>
                  
            </div>
            
            <button type="submit" id="submit-btn" >登　録</button>
        </form>
    </div>

    <!-- 登録店舗表示-->
    <div id="outputArea" class=" confirm-view" hidden>
        <h2>登録されました</h2>
        <img id="displayPhoto" src="" style="width: 100px;">
        <p id="displayName"></p>
        <p id="displayAddress"></p>
        <p id="displayJenre"></p>
        <p id="displayPrice"></p>
        <button type="button" id="back-btn">新しく店舗を登録する</button>
    </div>

    <script src="./main.js"></script>
</body>

</html>
