<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>プチオープンキャンパス2026
    </title>
    <link rel="stylesheet" href="./style.css">
    <style>
        body{
            background-color: #eed4a4;/*背景色を変えてみよう*/
            
            /*この下から背景のデザインを記述*/
            
            
        }

    </style>
</head>

<body>
    <div class="container" id="form-view">
        <form id="store">
            <h2>新規店舗登録</h2>
            <div class="second-container">
                <span>店舗名<span class="required">必須</span>：</span>
                <input type="text" id="store-name" name="store-name" autocomplete="organization">
                <div id="nameError" class="error-message"></div>
            </div>

            <div class="second-container">
                <span>住所<span class="required">必須</span>：</span><br>
                <div>
                    <input type="text" id="searchBox" placeholder="例:8130004(ﾊｲﾌﾝなし)" onkeyup="inputCheck ()">
                    <button type="button" id="search-btn" onclick="searchAddress ()">住所検索</button>
                </div>
                <div id="check"></div>
                <p>都道府県<input type="text" id="address-prefecture" name="address-prefecture"></p>
                <p>市区町村<input type="text" id="address-city" name="address-city"></p>
                <p>番地<input type="text" id="address-street" name="address-street"></p>
                <div id="addressError" class="error-message"></div>
            </div>

            <div class="second-container">
                <span>ジャンル<span class="required">必須</span>：</span>
                <span style="color: rgb(240, 66, 66); font-size:small;margin-bottom: 10px;">一つ以上選択してください</span>
                <div id="jenre-item" class="genre-list">
                    <label class="checkbox-option"><input type="checkbox" name="jenre-item" value="和食"> 和食</label>
                    <label class="checkbox-option"><input type="checkbox" name="jenre-item" value="洋食"> 洋食</label>
                    <label class="checkbox-option"><input type="checkbox" name="jenre-item" value="中華"> 中華</label>
                    <label class="checkbox-option"><input type="checkbox" name="jenre-item" value="カフェ"> カフェ</label>
                    <label class="checkbox-option"><input type="checkbox" name="jenre-item" value="イタリアン"> イタリアン</label>
                    <!--ジャンルを追加-->




                </div>
                <div id="checkboxError" class="error-message"></div>
            </div>

            <div class="second-container">
                <span>価格帯：</span>
                <div>
                    <p>
                        <span id="price-min-label"></span>
                        <span>〜</span>
                        <span id="price-max-label"></span>
                    </p>
                    <div class="range-slider__wrapper">
                        <div class="range-slider__track">
                            <div class="range-slider__fill" id="price-range-fill"></div>
                        </div>
                        <input type="range" id="price-min" class="range-slider__input range-slider__input--min" min="0"
                            max="6" step="1" value="0" aria-label="価格の下限">
                        <input type="range" id="price-max" class="range-slider__input range-slider__input--max" min="0"
                            max="6" step="1" value="6" aria-label="価格の上限">
                    </div>
                </div>
            </div>

            <button type="submit" id="submit-btn" >登　録</button>
        </form>
    </div>

    <!-- 登録店舗表示　-->
    <div id="outputArea" class=" confirm-view" hidden>
        <h2>登録されました</h2>
        <p id="displayName"></p>
        <p id="displayAddress"></p>
        <p id="displayJenre"></p>
        <p id="displayPrice"></p>
        <button type="button" id="back-btn">新しく店舗を登録する</button>
    </div>

    <script src="./main.js"></script>
</body>

</html>
